name: keirin

# 時刻はUTC。日本時間 = UTC + 9時間
#
# 設計:
#  日々の実行は cron-job.org から workflow_dispatch を叩いて起動する。
#  (GitHubの schedule は不発が多いため 2026/08/28 に移行)
#   06:00 scrape / 19:00 generate
#   08:00 モーニング / 10:00 デイ / 15:30 ナイター / 19:30 ミッドナイト
#  投稿は生成済みファイルを読むだけ。posted.log で二重投稿を防ぐ。
on:
  schedule:
    - cron: "0 11 * * 0,3"  # JST 20:00(日・水) 代謝ボーダー
  workflow_dispatch:         # 手動実行・動作確認用
    inputs:
      job:
        description: "実行する処理"
        required: true
        default: scrape
        type: choice
        options: [scrape, generate, post, taisha, site, alert, notepost]
      slot:
        description: "job=post のときだけ使う時間帯"
        required: false
        default: モーニング
        type: choice
        options: [モーニング, デイ, ナイター, ミッドナイト]
      post:
        description: "実際に投稿する(false ならプレビューのみ)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

# 同時に走らないようにする(スナップショットの取り合いを防ぐ)
concurrency:
  group: keirin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # スナップショットをコミットするため

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: pip install requests beautifulsoup4 requests-oauthlib

      - name: どの処理を走らせるか決める
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> $GITHUB_OUTPUT
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
            echo "post=${{ inputs.post }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 21 * * *")   echo "job=scrape"   >> $GITHUB_OUTPUT ;;
              "0 10 * * *")   echo "job=generate" >> $GITHUB_OUTPUT ;;
              "0 23 * * *")   echo "job=post"     >> $GITHUB_OUTPUT
                              echo "slot=モーニング" >> $GITHUB_OUTPUT ;;
              "0 1 * * *")    echo "job=post"     >> $GITHUB_OUTPUT
                              echo "slot=デイ"      >> $GITHUB_OUTPUT ;;
              "30 6 * * *")   echo "job=post"     >> $GITHUB_OUTPUT
                              echo "slot=ナイター"   >> $GITHUB_OUTPUT ;;
              "30 10 * * *")  echo "job=post"     >> $GITHUB_OUTPUT
                              echo "slot=ミッドナイト" >> $GITHUB_OUTPUT ;;
              "0 11 * * 0,3") echo "job=taisha"   >> $GITHUB_OUTPUT ;;
            esac
            echo "post=true" >> $GITHUB_OUTPUT
          fi

      # ---- データ取得(毎朝) ----
      - name: スナップショット取得
        if: steps.pick.outputs.job == 'scrape'
        run: python scrape.py all

      # ---- 翌日分の投稿文を生成だけする(まだ投稿しない) ----
      - name: 翌日分の投稿文を生成
        if: steps.pick.outputs.job == 'generate'
        run: python shobugake.py

      # ---- 生成済みの投稿文を、時間帯の直前に送る ----
      - name: 勝負駆けを投稿
        if: steps.pick.outputs.job == 'post'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          if [ "${{ steps.pick.outputs.post }}" = "true" ]; then
            python post.py 0 --slot "${{ steps.pick.outputs.slot }}" --post
          else
            python post.py 0 --slot "${{ steps.pick.outputs.slot }}"
          fi
            # ---- 代謝危機の出走通知(各時間帯の5分後) ----
      - name: 代謝危機の通知を生成して投稿
        if: steps.pick.outputs.job == 'alert'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python taisha_alert.py --write
          if [ "${{ steps.pick.outputs.post }}" = "true" ]; then
            python post.py 0 --slot "${{ steps.pick.outputs.slot }}" --slot 代謝危機 --post
          else
            python post.py 0 --slot "${{ steps.pick.outputs.slot }}" --slot 代謝危機
          fi
        
      # ---- 代謝ボーダー(週2: 水・日) ----
      - name: 代謝ボーダーを生成
        if: steps.pick.outputs.job == 'taisha'
        run: python taisha.py --write

      - name: 代謝ボーダーを投稿
        if: steps.pick.outputs.job == 'taisha'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          if [ "${{ steps.pick.outputs.post }}" = "true" ]; then
            python post.py 0 --post
          else
            python post.py 0
          fi

      # ---- サイト更新(scrape後・taisha後・手動) ----
      - name: サイトを生成
        if: steps.pick.outputs.job == 'scrape' || steps.pick.outputs.job == 'taisha' || steps.pick.outputs.job == 'site'
        run: python build_site.py

      # ---- noteに出走まとめを投稿(手動/外部cron) ----
      - name: noteに勝負駆け・代謝危機まとめを投稿
        if: steps.pick.outputs.job == 'notepost'
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: python keirin_note.py --post
        
        # ---- 結果を保存 ----
      - name: スナップショットと投稿履歴をコミット
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 存在するものだけを個別に追加する。
          # まとめて git add すると、片方が無いだけで全部追加されない
          for p in snapshots posts posted.log docs; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git status --short
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "auto: ${{ steps.pick.outputs.job }} ${{ steps.pick.outputs.slot }} $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
